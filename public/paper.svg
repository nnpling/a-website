<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <!-- Vân giấy kraft: sợi mịn + vài đốm sẫm, lặp lại làm nền -->
  <filter id="fibers" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.24  0 0 0 0.22 -0.07"/>
  </filter>
  <filter id="flecks" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.26  0 0 0 0 0.18  0 0 0 14 -9.4"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#fibers)"/>
  <rect width="100%" height="100%" filter="url(#flecks)" opacity="0.3"/>
</svg>
